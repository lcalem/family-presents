services:
  mongo_prod:
    image: mongo:3.4
    networks:
      - overlay
    restart: unless-stopped

  server_prod:
    image: gifts_prod:latest
    environment:
      - "ENV=prod"
    volumes:
      - ${PROJECT_HOME}/shared_images:/app/images
    networks:
      - overlay
      - proxy
    restart: unless-stopped

networks:
    overlay:
    proxy:
            external: true
